meta:
  # source: https://dev.meta.ai/docs/quickstart — "Base URL: https://api.meta.ai/v1"
  base_url: "https://api.meta.ai/v1"
  api_key_env: "META_API_KEY"

basten:
  base_url: "https://inference.baseten.co/v1"
  api_key_env: "BASETEN_API_KEY"

models:
  spark:
    model_id: "meta-models/muse-spark-open-1026"
    # source: https://docs.baseten.co/reference/inference-api/chat-completions — "curl https://inference.baseten.co/v1/chat/completions"
    endpoint: "/chat/completions"
    temperature: 0.0
  image:
    # source: https://github.com/meta-models/meta-model-cookbook/blob/main/05_muse_image/01_image_api_fundamentals/README.md:7 — "**Model** | `muse-image-1.0`"
    model_id: "muse-image-1.0"
    # source: https://github.com/meta-models/meta-model-cookbook/blob/main/05_muse_image/01_image_api_fundamentals/README.md:91 — "turn1 = client.responses.create("
    endpoint: "/responses"
    # source: https://github.com/meta-models/meta-model-cookbook/blob/main/05_muse_image/01_image_api_fundamentals/README.md:123 — "turn2 = client.responses.create("
    edit_endpoint: "/responses"
  sam:
    # source: https://github.com/meta-models/meta-model-cookbook/blob/main/07_sam/01_api_basics/README.md:8 — "**Model** | `sam-3.1`"
    model_id: "sam-3.1"
    # source: https://github.com/meta-models/meta-model-cookbook/blob/main/07_sam/01_api_basics/python/sam_api.py:120 — "stream = await api.responses.create("
    endpoint: "/responses"

agent:
  max_rounds: 4
  iou_threshold: 0.5
  min_mask_area_ratio: 0.0001
  position_tolerance: 0.10

eval:
  default_max_cost_usd: 2.00
  cost_per_image_usd: 0.01
  cost_per_sam_call_usd: 0.0025

mock:
  enabled: false
  spark: false
  image: false
  sam: false
  force_fail_first_round: true
